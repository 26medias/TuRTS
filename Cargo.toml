[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["tests/boundary-fixture", "tests/spike-web", "vendor/aeronet_websocket"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-TBD"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ron = "=0.12.2"
sha2 = "=0.11.1"
semver = "=1.0.28"
tar = { version = "=0.4.46", default-features = false }
bevy = { version = "=0.20.0", default-features = false }
bevy_app = "=0.20.0"
bevy_ecs = "=0.20.0"
bevy_time = "=0.20.0"
bevy_math = "=0.20.0"
lightyear = { version = "=0.31.0", default-features = false, features = ["std", "websocket", "netcode"] }
postcard = "=1.1.3"
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net"] }
tower-http = { version = "=0.7.1", features = ["fs", "cors"] }
ureq = "=3.5.0"
gloo-net = "=0.7.0"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
wasm-bindgen-test = "=0.3.79"
web-sys = "=0.3.106"
js-sys = "=0.3.106"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

# Server TCP no-delay (vendor/aeronet_websocket/VENDORED.md).
[patch.crates-io]
aeronet_websocket = { path = "vendor/aeronet_websocket" }
