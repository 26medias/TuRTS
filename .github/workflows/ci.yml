name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TURTS_BOT_EVIDENCE_DIR: ${{ github.workspace }}/target/ci-evidence/bots
      TURTS_REFUTATION_EVIDENCE_DIR: ${{ github.workspace }}/target/m3-evidence/t16-builder/refutations/native
      TURTS_REFUTATION_BUILD_ROOT: ${{ github.workspace }}/target/m3-t16/refutations/native-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native, strict)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check (wasm32)
        run: cargo check --workspace --exclude turts_server --target wasm32-unknown-unknown --locked
      - name: Test (native, headless)
        run: cargo test --workspace --exclude turts_server --locked
      # The terrain_group target of turts_server did not end in 3 h in debug (hosted run 45074697686;
      # locally more than 40 min). It ends in about 10 min in release. The release run keeps the debug
      # assertions and the overflow checks, so it tests the same checks as the debug run.
      - name: Test turts_server (release, debug assertions and overflow checks on)
        env:
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test -p turts_server --release --locked
      - name: Probe neutrality (test-probes off equals on)
        run: bash scripts/qa/probe_neutral.sh
      - name: T1 dependency boundary
        run: bash scripts/boundary.sh
      - name: Python refutation harness tests
        run: |
          python3 tests/m2/test_refutations.py
          python3 tests/m2/test_m2_browser_suite.py
          python3 tests/m2/test_recipe_duration.py
          python3 tests/m2/test_local_only.py
          python3 tests/m2/test_browser_fixture.py
          python3 tests/m2/local_only.py --check
      - name: Python browser row parameter tests
        run: python3 tests/mc/test_mc_browser_params.py
      # The re-freeze classifier of the pre-MP1 slice (Q1a, Q1b): its plant self-test and its unit tests.
      - name: Re-freeze classifier self-test and tests
        run: |
          python3 -B tests/m3/refreeze_classify.py --self-test
          python3 -B tests/m3/test_refreeze_classify.py
      - name: Acceptance (M2 and M3 process tests, release, serial)
        run: bash scripts/acceptance.sh
      - name: Upload native and acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m2-native-and-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/m2-refutations/**
            target/acceptance/**
            target/task15-evidence/**
            target/ci-evidence/**
            target/m2-public-proof/**
            target/m3-evidence/t16-builder/**
  # Product CI runs the native, process and browser contracts once. Historical
  # fault-injection campaigns remain available through scripts/m2-refutations.sh
  # and tests/m3/refutations.py. Their planted-source hashes do not gate main.
  browser:
    name: browser ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: t7-m3
          - suite: m2
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      M2_ARTIFACT_ROOT: ${{ github.workspace }}/target/m2-browser/runs
      M2_CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      M2_BUILD_JOBS: "2"
      M2_HEADLESS: "false"
      M2_CHROME_ARGS_JSON: '["--enable-gpu","--use-angle=gl","--enable-unsafe-webgpu","--ignore-gpu-blocklist"]'
      M2_IGNORE_DEFAULT_ARGS_JSON: '["--enable-unsafe-swiftshader"]'
      # Economy cases only: 4 times the recipe time in the packed copy (see the comment above the job).
      M2_RECIPE_DURATION_SCALE: "4"
      # One loss case, same method, own factor (see the comment above the job).
      M2_RECIPE_DURATION_SCALE_CASES: "E9-browser-base-loss-refund=5"
      # Cases that need a real GPU and are not run here (see the comment above the job). Each one needs
      # a row in tests/m2/local-only.tsv. Keep this a plain quoted comma list.
      M2_LOCAL_ONLY_CASES: "E9-browser-base-public-convergence,E9-browser-haul-public-convergence,E9-browser-acme-public-convergence,E9-browser-cedar-public-convergence,E9-browser-convergence-owner-offset"
      TURTS_REFUTATION_EVIDENCE_DIR: ${{ github.workspace }}/target/m3-evidence/t16-builder/refutations/browser
      TURTS_REFUTATION_BUILD_ROOT: ${{ github.workspace }}/target/m3-t16/refutations/browser-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # `cache-bin: false` leaves ~/.cargo/bin to the trunk cache below.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Cache trunk
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-0.22.0-${{ runner.os }}
      - name: Install trunk 0.22.0
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked trunk --version 0.22.0
      # The browser scripts build with CARGO_NET_OFFLINE=true (scripts/m2-browser.sh, m2_build;
      # scripts/m3-browser.sh). A fresh runner has only the crates of the trunk install, so the
      # first offline build of the m2 and refutation legs failed with "no matching package named
      # ron found" (hosted run 43195887161). Fetch every locked crate while the network is on.
      - name: Fetch the locked crates (the browser scripts build offline)
        run: cargo fetch --locked
      # Trunk downloads wasm-bindgen and wasm-opt at versions pinned by Trunk.toml.
      - name: Cache the tools that trunk downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('crates/turts_client_web/Trunk.toml') }}
      - name: Install browser and Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev brotli xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned browser test dependencies
        run: npm ci
        working-directory: tests/browser
      - name: Browser projection and audit helper tests
        if: matrix.suite == 't7-m3'
        run: node --test tests/browser/m2-projection.test.js tests/browser/m2-audit.test.js tests/browser/egpu-stats.test.js tests/browser/t7-oracle.test.js tests/browser/t7-driver.test.js tests/browser/m3-oracle.test.js tests/browser/pt1-oracle.test.js tests/browser/m2-oracle.test.js tests/browser/harness/debug-request.test.js tests/browser/harness/debug-request-use.test.js tests/browser/harness/checkpoint-run.test.js tests/browser/mp1-capture.test.js tests/browser/audio-resume-hook.test.js tests/browser/harness/bounded-raf.test.js tests/browser/harness/capture-contract.test.js tests/browser/harness/ci-node-list.test.js tests/browser/harness/cli.test.js tests/browser/harness/click9-pixels.test.js tests/browser/harness/contextmenu-observer.test.js tests/browser/harness/device-audit-descriptor.test.js tests/browser/harness/device-audit.test.js tests/browser/harness/document-epoch.test.js tests/browser/harness/hd1-ui-pixels.test.js tests/browser/harness/hud1-oracle.test.js tests/browser/harness/hud4-oracle.test.js tests/browser/harness/hud4-pixels.test.js tests/browser/harness/io-contract.test.js tests/browser/harness/io-event-observer.test.js tests/browser/harness/launch-profile.test.js tests/browser/harness/m2-fixture.test.js tests/browser/harness/measure-launch-options.test.js tests/browser/harness/params-contract.test.js tests/browser/harness/pixel-profile.test.js tests/browser/harness/png.test.js tests/browser/harness/project.test.js tests/browser/harness/scene-checkpoints.test.js tests/browser/harness/startup-record.test.js tests/browser/harness/wait-sync-scan.test.js tests/browser/harness/wait-sync.test.js tests/browser/measure-webgpu-hook.test.js tests/browser/shell-oracle-cam2.test.js tests/browser/shell-oracle-km2-pixels.test.js tests/browser/shell-oracle-km2.test.js tests/browser/shell-oracle-p1-attachment.test.js tests/browser/shell-oracle-sh1.test.js tests/browser/shell-oracle-slot1-deadline.test.js tests/browser/shell-oracle-slot1-receipts.test.js tests/browser/vis-full-driver.test.js tests/browser/vis-full-oracle.test.js tests/browser/vis2-validation.test.js tests/browser/cold-play.test.js tests/browser/cold-probe.test.js tests/browser/harness/silent-chrome-scan.test.js tests/browser/harness/sound-switch-pixels.test.js tests/browser/hud2-driver.test.js tests/browser/volume-tracks.test.js tests/browser/ord3-route.test.js tests/browser/mm1-driver.test.js tests/browser/sel3-double-click.test.js tests/browser/harness/reload-bridges.test.js tests/browser/mm1-oracle.test.js tests/browser/harness/client-error.test.js tests/browser/harness/client-settings-seed.test.js tests/browser/m2-recipe.test.js tests/browser/checkpoint-lib.test.js tests/browser/oracle-connection.test.js tests/browser/terrain-fps-intervals.test.js tests/browser/terrain-group/selection-box.test.js tests/browser/terrain-group/settled-tracker.test.js tests/browser/terrain-group/free-point.test.js tests/browser/terrain-group/overlap-rule.test.js tests/browser/terrain-fps-orders.test.js
      # The browser steps use the Chrome profile of the job env.
      - name: T7 browser join
        if: matrix.suite == 't7-m3'
        # The software renderer shows one frame every 2 to 3.4 s. A scout at speed 6 crosses the T7
        # path in 6.8 s, so hosted run 43174011989 recorded 2 frames in the move, and the oracle
        # needs 3. Speed 1.5 gives a move of about 27 s (scripts/t7.sh, T7_SCOUT_SPEED).
        env:
          T7_SCOUT_SPEED: "1.5"
        run: bash scripts/t7.sh
      # M3 runs also after a red T7, so one run shows both results.
      - name: M3 browser controls (F10, private Xvfb, software WebGPU)
        if: ${{ matrix.suite == 't7-m3' && !cancelled() }}
        run: bash scripts/m3-browser.sh
      - name: M2 browser proof (base, haul, acme, cedar)
        if: matrix.suite == 'm2'
        run: bash scripts/m2-browser.sh
      - name: Upload browser and T7 diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.suite }}${{ matrix.case && format('-{0}', matrix.case) || '' }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          # Every run folder of the browser steps: T7 and M3 under t16-builder, M2 under
          # m2-browser/runs, the refutations under t16-builder/refutations. The M3 economy log
          # is 1.5 to 3.3 GB (ci-run134-m3-sw-gl-1), so the upload leaves out the economy logs.
          path: |
            target/m2-browser/runs/**
            target/m2-refutations/**
            target/t7/**
            target/task16-evidence/**
            target/m3-evidence/t16-builder/**
            !target/**/economy.jsonl
            !target/**/economy-audit-private.jsonl
  agents:
    runs-on: ubuntu-24.04
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Agent roster checks (no claude CLI on CI)
        run: SKIP_VALIDATE=1 bash docs/agents/check.sh && SKIP_VALIDATE=1 bash docs/agents/check_fixtures.sh && bash docs/agents/check_claude_md.sh
      - name: Yardstick list in sync
        run: python3 scripts/qa/yardstick.py --check
      - name: Legacy completeness classifier self-test
        run: python3 scripts/qa/completeness.py --self-test
      - name: MP1 plant runner self-test
        run: python3 -B scripts/qa/mp1_plants.py --self-test
      - name: Prepared browser runs (the stale check; fake cargo, trunk and node, no GPU)
        run: python3 -B tests/qa/test_mc_prepare.py
      - name: Cold-play checker (evidence folders built by hand; no browser)
        run: python3 -B tests/qa/test_cold_play_check.py
      - name: Every Python test runs in CI or has a reason
        run: python3 tests/qa/test_python_ci_list.py
      - name: Skirmish hosting and web compression tools
        run: |
          python3 tests/qa/test_skirmish_host.py
          python3 tests/qa/test_skirmish_share.py
          python3 tests/qa/test_web_compression.py
          python3 tests/qa/test_web_compression_edges.py
