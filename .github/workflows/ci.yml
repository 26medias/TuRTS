name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TURTS_REFUTATION_EVIDENCE_DIR: ${{ github.workspace }}/target/m3-evidence/t16-builder/refutations/native
      TURTS_REFUTATION_BUILD_ROOT: ${{ github.workspace }}/target/m3-t16/refutations/native-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (native, strict)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check (wasm32)
        run: cargo check --workspace --exclude turts_server --target wasm32-unknown-unknown --locked
      - name: Test (native, headless)
        run: cargo test --workspace --locked
      - name: Probe neutrality (test-probes off equals on)
        run: bash scripts/qa/probe_neutral.sh
      - name: T1 dependency boundary
        run: bash scripts/boundary.sh
      - name: Python refutation harness tests
        run: python3 tests/m2/test_refutations.py
      - name: M2 native-only semantic refutations
        run: bash scripts/m2-refutations.sh --case ci-native
      - name: M3 semantic refutations (all 17 plants)
        run: bash scripts/m3-refutations.sh --case all
      - name: Acceptance (M2 and M3 process tests, release, serial)
        run: bash scripts/acceptance.sh
      - name: Upload native and acceptance diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m2-native-and-acceptance-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/m2-refutations/**
            target/acceptance/**
            target/task15-evidence/**
            target/m2-public-proof/**
            target/m3-evidence/t16-builder/**
  # T7 and M2 browser proof need a real browser process, Trunk, wasm and a
  # software Vulkan implementation; hosted CI does not require an NVIDIA GPU.
  browser:
    runs-on: ubuntu-latest
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 340
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      M2_ARTIFACT_ROOT: ${{ github.workspace }}/target/m2-browser/runs
      M2_CARGO_TARGET_DIR: ${{ github.workspace }}/target/m3-t16
      M2_BUILD_JOBS: "2"
      M2_HEADLESS: "false"
      M2_CHROME_ARGS_JSON: '["--enable-gpu","--use-angle=vulkan","--enable-features=Vulkan","--enable-unsafe-webgpu"]'
      M2_IGNORE_DEFAULT_ARGS_JSON: '["--enable-unsafe-swiftshader"]'
      TURTS_REFUTATION_EVIDENCE_DIR: ${{ github.workspace }}/target/m3-evidence/t16-builder/refutations/browser
      TURTS_REFUTATION_BUILD_ROOT: ${{ github.workspace }}/target/m3-t16/refutations/browser-build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # `cache-bin: false` leaves ~/.cargo/bin to the trunk cache below.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Cache trunk
        id: trunk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/trunk
          key: trunk-0.22.0-${{ runner.os }}
      - name: Install trunk 0.22.0
        if: steps.trunk-cache.outputs.cache-hit != 'true'
        run: cargo install --locked trunk --version 0.22.0
      # Trunk downloads wasm-bindgen and wasm-opt at versions pinned by Trunk.toml.
      - name: Cache the tools that trunk downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ runner.os }}-${{ hashFiles('crates/turts_client_web/Trunk.toml') }}
      - name: Install browser and Bevy system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libasound2-dev libudev-dev libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev brotli xvfb mesa-vulkan-drivers libvulkan1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pinned browser test dependencies
        run: npm ci
        working-directory: tests/browser
      - name: Browser projection and audit helper tests
        run: node --test tests/browser/m2-projection.test.js tests/browser/m2-audit.test.js tests/browser/egpu-stats.test.js tests/browser/t7-oracle.test.js tests/browser/t7-driver.test.js tests/browser/m3-oracle.test.js tests/browser/pt1-oracle.test.js tests/browser/m2-oracle.test.js tests/browser/harness/debug-request.test.js tests/browser/harness/debug-request-use.test.js tests/browser/harness/checkpoint-run.test.js tests/browser/mp1-capture.test.js tests/browser/audio-resume-hook.test.js tests/browser/harness/bounded-raf.test.js tests/browser/harness/capture-contract.test.js tests/browser/harness/ci-node-list.test.js tests/browser/harness/cli.test.js tests/browser/harness/click9-pixels.test.js tests/browser/harness/contextmenu-observer.test.js tests/browser/harness/device-audit-descriptor.test.js tests/browser/harness/device-audit.test.js tests/browser/harness/document-epoch.test.js tests/browser/harness/hd1-ui-pixels.test.js tests/browser/harness/hud1-oracle.test.js tests/browser/harness/hud4-oracle.test.js tests/browser/harness/hud4-pixels.test.js tests/browser/harness/io-contract.test.js tests/browser/harness/io-event-observer.test.js tests/browser/harness/launch-profile.test.js tests/browser/harness/m2-fixture.test.js tests/browser/harness/measure-launch-options.test.js tests/browser/harness/params-contract.test.js tests/browser/harness/pixel-profile.test.js tests/browser/harness/png.test.js tests/browser/harness/project.test.js tests/browser/harness/scene-checkpoints.test.js tests/browser/harness/startup-record.test.js tests/browser/harness/wait-sync-scan.test.js tests/browser/harness/wait-sync.test.js tests/browser/measure-webgpu-hook.test.js tests/browser/shell-oracle-cam2.test.js tests/browser/shell-oracle-km2-pixels.test.js tests/browser/shell-oracle-km2.test.js tests/browser/shell-oracle-p1-attachment.test.js tests/browser/shell-oracle-sh1.test.js tests/browser/shell-oracle-slot1-deadline.test.js tests/browser/shell-oracle-slot1-receipts.test.js tests/browser/vis-full-driver.test.js tests/browser/vis-full-oracle.test.js tests/browser/vis2-validation.test.js
      - name: T7 browser join
        env:
          M2_HEADLESS: "false"
          M2_CHROME_ARGS_JSON: '["--enable-gpu","--use-angle=vulkan","--enable-features=Vulkan","--enable-unsafe-webgpu"]'
          M2_IGNORE_DEFAULT_ARGS_JSON: '["--enable-unsafe-swiftshader"]'
        run: bash scripts/t7.sh
      - name: M2 browser proof (base, haul, acme, cedar)
        run: bash scripts/m2-browser.sh
      - name: M3 browser controls (F10, private Xvfb/Vulkan)
        env:
          M2_HEADLESS: "false"
          M2_CHROME_ARGS_JSON: '["--enable-gpu","--use-angle=vulkan","--enable-features=Vulkan","--enable-unsafe-webgpu"]'
          M2_IGNORE_DEFAULT_ARGS_JSON: '["--enable-unsafe-swiftshader"]'
        run: bash scripts/m3-browser.sh
      - name: M2 browser-only semantic refutations
        run: bash scripts/m2-refutations.sh --case ci-browser
      - name: Upload browser, T7, and refutation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m2-browser-and-refutations-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/m2-browser/runs/**
            target/m2-refutations/**
            target/t7/**
            target/task16-evidence/**
            target/m3-evidence/t16-builder/**
  agents:
    runs-on: ubuntu-latest
    # A hang must not hold a hosted runner for hours (RUN123 M3).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Agent roster checks (no claude CLI on CI)
        run: SKIP_VALIDATE=1 bash docs/agents/check.sh && SKIP_VALIDATE=1 bash docs/agents/check_fixtures.sh && bash docs/agents/check_claude_md.sh
      - name: Yardstick list in sync
        run: python3 scripts/qa/yardstick.py --check
      - name: Completeness gate
        run: python3 scripts/qa/completeness.py --self-test && python3 scripts/qa/completeness.py --enforce
      - name: Pixels-only driver rule
        run: python3 scripts/qa/driver_rule.py --self-test && python3 scripts/qa/driver_rule.py tests/browser
      - name: MP1 plant runner self-test
        run: python3 -B scripts/qa/mp1_plants.py --self-test
      - name: MP1 plant records apply to the tree (fast, no build, no test run)
        run: python3 -I -B scripts/qa/mp1_plants.py --check --all
      - name: Prepared browser runs (the stale check; fake cargo, trunk and node, no GPU)
        run: python3 -B tests/qa/test_mc_prepare.py
