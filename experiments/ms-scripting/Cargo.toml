# MS scripting selection spike. Standalone workspace: not a member of the root workspace.
[workspace]
resolver = "2"
members = ["ms_core", "ms_native", "ms_web"]

[workspace.package]
edition = "2021"
version = "0.0.0"
publish = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

# Same settings as the root `wasm-release` profile.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
