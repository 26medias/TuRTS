[package]
name = "mc_ui_probe"
version = "0.1.0"
edition = "2024"

[workspace]

[features]
audio = ["bevy/audio"]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "ui", "default_font", "webgpu"] }

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"
panic = "abort"
