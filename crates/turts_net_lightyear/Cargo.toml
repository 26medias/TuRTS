[package]
name = "turts_net_lightyear"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
turts_net_protocol = { path = "../turts_net_protocol" }
serde = { workspace = true }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
lightyear = { workspace = true }
bevy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
bevy_time = { workspace = true, optional = true }

[features]
client = ["lightyear/client"]
server = ["lightyear/server"]
spike = ["client", "server", "dep:bevy", "dep:serde_json", "dep:bevy_time"]

[dev-dependencies]
bevy_time = { workspace = true }

[[bin]]
name = "spike_server"
path = "src/bin/spike_server.rs"
required-features = ["spike"]

[[bin]]
name = "spike_client"
path = "src/bin/spike_client.rs"
required-features = ["spike"]
