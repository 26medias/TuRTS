[package]
name = "turts_client_web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
turts_client = { path = "../turts_client" }
serde_json = { workspace = true }
turts_net_protocol = { path = "../turts_net_protocol" }
bevy = { workspace = true, features = ["3d", "webgpu"] }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Location"] }

[dev-dependencies]
turts_mod_runtime = { path = "../turts_mod_runtime" }
wasm-bindgen-test = { workspace = true }
web-sys = { workspace = true, features = ["Document", "Element", "HtmlCanvasElement", "WebGl2RenderingContext"] }
