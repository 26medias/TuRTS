<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TuRTS</title>
    <link data-trunk rel="rust" data-cargo-profile="wasm-release" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>html,body{width:100%;height:100%;margin:0;overflow:hidden}#wrap{width:100vw;height:100vh}#turts{display:block;width:100%;height:100%}</style>
</head>
<body><div id="wrap"><canvas id="turts"></canvas></div>
<script>
    window.__turts_seq_queue = [];
    // Observe the real contexts Bevy creates before the WASM bundle initializes. A resume
    // request is only a request: readiness is derived later from each context's actual state.
    window.__turts_audio_contexts = [];
    window.__turts_audio_gesture_seen = false;
    const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
    if (NativeAudioContext) {
        const ObservedAudioContext = function (...args) {
            const context = new NativeAudioContext(...args);
            window.__turts_audio_contexts.push(context);
            return context;
        };
        ObservedAudioContext.prototype = NativeAudioContext.prototype;
        Object.setPrototypeOf(ObservedAudioContext, NativeAudioContext);
        window.AudioContext = ObservedAudioContext;
    }
    window.__turts_audio_context_states = () => window.__turts_audio_contexts.map(context => context.state);
    window.__turts_audio_snapshot = () => ({
        states: window.__turts_audio_context_states(),
        gesture_seen: window.__turts_audio_gesture_seen,
    });
    const activateTurtsAudio = () => {
        window.__turts_audio_gesture_seen = true;
        for (const context of window.__turts_audio_contexts) {
            if (context.state === "suspended") Promise.resolve(context.resume()).catch(() => {});
        }
    };
    document.addEventListener("pointerdown", activateTurtsAudio, true);
    document.addEventListener("keydown", activateTurtsAudio, true);
    const turtsCanvas = document.getElementById("turts");
    for (const type of ["pointerdown", "pointerup", "pointermove", "keydown", "keyup", "wheel"]) {
        document.addEventListener(type, event => {
            if (event.target !== turtsCanvas) return;
            const seq = window.__turts_io_seq;
            if (Number.isSafeInteger(seq) && seq >= 0) window.__turts_seq_queue.push({ seq, type });
        }, true);
    }
</script>
</body>
</html>
