[package]
name = "turts_sim"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test probes of the movement step (pre-MP1 task Q1b, design 9.20). The feature
# only adds fields and resources that tests read. It is off in every shipped build.
test-probes = []

[dependencies]
turts_mod_api = { path = "../turts_mod_api" }
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
bevy_time = { workspace = true }
bevy_math = { workspace = true, features = ["serialize"] }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
turts_mod_runtime = { path = "../turts_mod_runtime" }
