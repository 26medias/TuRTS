[package]
name = "turts_server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
turts_sim = { path = "../turts_sim" }
turts_audit = { path = "../turts_audit" }
turts_mod_runtime = { path = "../turts_mod_runtime" }
turts_mod_api = { path = "../turts_mod_api" }
turts_pack = { path = "../turts_pack" }
turts_net_protocol = { path = "../turts_net_protocol" }
turts_net_lightyear = { path = "../turts_net_lightyear", features = ["server"] }
bevy = { workspace = true }
lightyear = { workspace = true, features = ["server"] }
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
# The job progress test runs the real export against real `Replica` values (repair 2 of L0-WIRE).
# A dev-dependency: the boundary rules read the normal and build edges only.
turts_client = { path = "../turts_client" }
lightyear = { workspace = true, features = ["client"] }
turts_net_lightyear = { path = "../turts_net_lightyear", features = ["client"] }
ureq = { workspace = true }
serde_json = { workspace = true }
bevy_app = { workspace = true }
bevy_math = { workspace = true }
